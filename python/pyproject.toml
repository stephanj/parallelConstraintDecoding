[project]
name = "parallel-constrained-decoding"
version = "0.1.0"
description = "Local port of Parallel Constrained Decoding (KV-cache broadcast, sub-vocabulary logit slicing) for structured extraction on Apple Silicon via MLX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx>=0.22.0",
    "mlx-lm>=0.21.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]
